name: Ververs topics

on:
  schedule:
    # Elke 15 min, ma-vr, 05:00-20:45 UTC (7:00-22:45 in Belgie, incl.
    # zomertijd-marge). Loopt bewust door tot 's avonds laat: een artikel dat
    # pas na de vorige, kortere cron-vensters verscheen werd anders nooit
    # opgepikt en telde de volgende ochtend al als "gisteren" (dagelijkse
    # reset), zonder ooit ergens opgeslagen te zijn geweest.
    - cron: "*/15 5-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch en score artikels
        run: python3 fetch_and_score.py

      - name: Commit data.json
        run: |
          git config user.name "de7-topics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/recent_articles.json
          git diff --staged --quiet || git commit -m "Ververs topics"
          git push
