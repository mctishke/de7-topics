name: Ververs topics

on:
  schedule:
    # Elke 15 min, ma-vr, 05:00-11:45 UTC (7:00-13:45 in Belgie, incl. zomertijd-marge)
    - cron: "*/15 5-11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch en score artikels
        run: python3 fetch_and_score.py

      - name: Commit data.json
        run: |
          git config user.name "de7-topics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "Ververs topics"
          git push
