<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De 7 Topics — Archief</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e4e2dd;
    --text: #1c1c1a;
    --muted: #6b6a66;
    --accent: #b5121b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #202224;
      --border: #34363a;
      --text: #e8e8e6;
      --muted: #9a9a97;
      --accent: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  header { margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; border-radius: 6px; flex-shrink: 0; }
  h1 { font-size: 22px; margin: 0; }
  .archive-link { margin-left: auto; color: var(--muted); font-size: 13px; text-decoration: none; }
  .archive-link:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .avatar { border-radius: 999px; display: inline-block; vertical-align: middle; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit; }
  .avatar-initials {
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 600; background: var(--muted);
  }
  .avatar-toggle-btn {
    border: 2px solid transparent; background: none; padding: 0; border-radius: 999px; cursor: pointer;
    line-height: 0; opacity: 1; transition: opacity .15s ease, border-color .15s ease;
  }
  .avatar-toggle-btn.selected { border-color: var(--accent); }
  .avatar-toggle-btn.dimmed { opacity: .35; }
  .avatar-toggle-btn.dimmed:hover { opacity: .7; }

  .archive-card {
    display: flex; gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .archive-image {
    width: 84px; height: 84px; border-radius: 6px; object-fit: cover;
    background: var(--border); flex-shrink: 0;
  }
  .archive-content { flex: 1; min-width: 0; }
  .archive-date { color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .archive-title a { color: var(--text); text-decoration: none; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .archive-title a:hover { text-decoration: underline; }
  .archive-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .archive-meta .avatar { width: 18px; height: 18px; margin: 0 4px -4px 0; }
  .archive-makers { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .archive-makers-label { font-size: 12px; color: var(--muted); }
  .archive-makers-grid { display: flex; gap: 6px; flex-wrap: wrap; }

  .archive-edit-btn {
    border: none; background: none; color: var(--muted); font-size: 12px; cursor: pointer;
    padding: 0; margin-top: 8px;
  }
  .archive-edit-btn:hover { text-decoration: underline; }
  .archive-edit-form { display: none; margin-top: 8px; gap: 6px; flex-direction: column; }
  .archive-edit-form.open { display: flex; }
  .archive-edit-form input {
    padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  .archive-edit-form .archive-edit-actions { display: flex; gap: 6px; }
  .archive-edit-form button {
    border: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer;
  }
  .archive-edit-form .archive-edit-save { background: var(--accent); color: #fff; border-color: var(--accent); }

  [data-tooltip] { position: relative; }
  [data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20,20,20,.95);
    color: #fff;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .08s ease;
    z-index: 100;
  }
  [data-tooltip]:hover::after { opacity: 1; }

  .empty, .loading { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="logo.png" alt="De Tijd" class="logo">
      <h1>Archief</h1>
      <a href="index.html" class="archive-link">← Terug naar vandaag</a>
    </div>
    <div class="meta">Alle eerder gekozen daily-topics, per dag.</div>
  </header>
  <div id="list"><div class="loading">Laden...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script>
async function render() {
  const listEl = document.getElementById("list");

  if (!sb) {
    listEl.innerHTML = `<div class="empty">Supabase is nog niet geconfigureerd.</div>`;
    return;
  }

  const { data, error } = await sb.from("daily_picks").select("*").order("pick_date", { ascending: false });
  if (error) {
    console.error(error);
    listEl.innerHTML = `<div class="empty">Kon het archief niet laden.</div>`;
    return;
  }
  if (!data || data.length === 0) {
    listEl.innerHTML = `<div class="empty">Nog geen daily's gekozen.</div>`;
    return;
  }

  listEl.innerHTML = data.map(pick => {
    const dateLabel = new Date(`${pick.pick_date}T12:00:00`)
      .toLocaleDateString("nl-BE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    const imageHtml = pick.image
      ? `<img class="archive-image" src="${escapeHtml(pick.image)}" alt="" loading="lazy">`
      : "";
    return `
      <div class="archive-card">
        ${imageHtml}
        <div class="archive-content">
          <div class="archive-date">${escapeHtml(dateLabel)}</div>
          <div class="archive-title"><a href="${escapeHtml(pick.link)}" target="_blank" rel="noopener">${escapeHtml(pick.title)}</a></div>
          <div class="archive-meta">
            <span>${avatarHtml(pick.picked_by, 18)} Gekozen door ${escapeHtml(pick.picked_by)}</span>
          </div>
          <div class="archive-makers">
            <span class="archive-makers-label">Gemaakt door:</span>
            <div class="archive-makers-grid" id="makers-grid-${pick.id}"></div>
          </div>
          <button class="archive-edit-btn" data-id="${pick.id}">✏️ Verkeerd artikel? Aanpassen</button>
          <div class="archive-edit-form" id="edit-form-${pick.id}">
            <input type="text" class="edit-title" placeholder="Titel" value="${escapeHtml(pick.title)}">
            <input type="text" class="edit-link" placeholder="Link (tijd.be-URL)" value="${escapeHtml(pick.link)}">
            <div class="archive-edit-actions">
              <button class="archive-edit-save" data-id="${pick.id}">Opslaan</button>
              <button class="archive-edit-cancel" data-id="${pick.id}">Annuleren</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join("");

  data.forEach(pick => {
    const container = document.getElementById(`makers-grid-${pick.id}`);
    const repaint = () => {
      paintMakerGrid(container, pick.makers || [], async name => {
        pick.makers = (pick.makers || []).includes(name)
          ? pick.makers.filter(m => m !== name)
          : [...(pick.makers || []), name];
        repaint();
        const { error } = await sb.from("daily_picks").update({ makers: pick.makers }).eq("id", pick.id);
        if (error) console.error("Kon makers niet opslaan:", error);
      });
    };
    repaint();
  });

  listEl.querySelectorAll(".archive-edit-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.getElementById(`edit-form-${btn.dataset.id}`).classList.toggle("open");
    });
  });
  listEl.querySelectorAll(".archive-edit-cancel").forEach(btn => {
    btn.addEventListener("click", () => {
      document.getElementById(`edit-form-${btn.dataset.id}`).classList.remove("open");
    });
  });
  listEl.querySelectorAll(".archive-edit-save").forEach(btn => {
    btn.addEventListener("click", async () => {
      const form = document.getElementById(`edit-form-${btn.dataset.id}`);
      const title = form.querySelector(".edit-title").value.trim();
      const link = form.querySelector(".edit-link").value.trim();
      if (!title || !link) { alert("Titel en link zijn verplicht."); return; }
      const { error } = await sb.from("daily_picks").update({ title, link }).eq("id", btn.dataset.id);
      if (error) { console.error(error); alert("Kon niet opslaan."); return; }
      await render();
    });
  });
}

render().catch(e => {
  console.error("Onverwachte fout bij renderen:", e);
  document.getElementById("list").innerHTML = `<div class="empty">Er ging iets mis bij het laden.</div>`;
});
</script>
</body>
</html>
