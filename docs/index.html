<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De 7 Topics</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e4e2dd;
    --text: #1c1c1a;
    --muted: #6b6a66;
    --accent: #b5121b;
    --accent-bg: #fdeceb;
    --star: #b8860b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #202224;
      --border: #34363a;
      --text: #e8e8e6;
      --muted: #9a9a97;
      --accent: #ff6b6b;
      --accent-bg: #3a2323;
      --star: #f5c451;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  header { margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; border-radius: 6px; flex-shrink: 0; }
  h1 { font-size: 22px; margin: 0; }
  .archive-link { margin-left: auto; color: var(--muted); font-size: 13px; text-decoration: none; }
  .archive-link:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .who-picker { margin-top: 14px; }
  .who-label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  .who-avatars { display: flex; gap: 8px; flex-wrap: wrap; }
  .who-btn {
    border: 2px solid transparent; background: none; padding: 0;
    border-radius: 999px; cursor: pointer; line-height: 0;
  }
  .who-btn.selected { border-color: var(--accent); }

  .avatar { border-radius: 999px; object-fit: cover; display: inline-block; vertical-align: middle; }
  .avatar-initials {
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 600; background: var(--muted);
  }

  .sort-toggle { display: flex; gap: 6px; margin-top: 14px; }
  .sort-btn {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer;
  }
  .sort-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  .section { margin-bottom: 22px; }
  .section-header {
    display: flex; align-items: center; gap: 6px; width: 100%; text-align: left;
    background: none; border: none; cursor: pointer; padding: 4px 0; margin-bottom: 8px;
  }
  .chevron { font-size: 11px; color: var(--muted); width: 10px; }
  .section-title {
    font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em;
  }
  .section.highlight {
    background: #18457C;
    border-radius: 14px;
    padding: 12px 12px 4px;
  }
  .section.highlight .chevron,
  .section.highlight .section-title { color: #fff; }
  .pubdate { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card-top { display: flex; gap: 12px; align-items: flex-start; }
  .card-image {
    display: block;
    width: 84px;
    height: 84px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--border);
    flex-shrink: 0;
  }
  .card-content { flex: 1; min-width: 0; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--border);
    color: var(--muted);
  }
  .badge.de7 { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .title a { color: var(--text); text-decoration: none; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .title a:hover { text-decoration: underline; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 12px; flex-wrap: wrap; }
  .votes { display: flex; align-items: center; gap: 8px; }
  .star-btn {
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 6px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 16px;
    color: var(--muted);
    line-height: 1.3;
  }
  .star-btn:hover { background: var(--border); }
  .star-btn.starred { color: var(--star); border-color: var(--star); }
  .net { font-weight: 600; min-width: 14px; text-align: center; }
  .voters { display: flex; align-items: center; }
  .voters .avatar { width: 22px; height: 22px; margin-left: -6px; border: 2px solid var(--card); }
  .voters-extra { font-size: 11px; color: var(--muted); margin-left: 6px; }
  .score { color: var(--muted); font-size: 12px; }
  .card-actions { display: flex; gap: 6px; }
  .card-actions button {
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    border-radius: 6px; padding: 5px 7px; cursor: pointer; display: flex; align-items: center;
  }
  .card-actions button:hover { background: var(--border); }
  .muted { color: var(--muted); }
  .comments { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
  .comment { display: flex; gap: 8px; font-size: 13px; margin-bottom: 10px; }
  .comment .avatar { width: 24px; height: 24px; flex-shrink: 0; margin-top: 1px; }
  .comment .author { font-weight: 600; }
  .comment .body { color: var(--text); margin-top: 1px; }
  .comment-form { display: flex; gap: 6px; margin-top: 8px; }
  .comment-form input[type=text] {
    flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  .comment-form button {
    border: none; background: var(--accent); color: white; border-radius: 6px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .daily-banner {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 22px;
    background: #18457C;
    min-height: 180px;
  }
  .daily-banner-image { display: block; width: 100%; height: 220px; object-fit: cover; opacity: .55; }
  .daily-banner-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 16px; background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0) 70%);
  }
  .daily-banner-tag {
    color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    background: rgba(255,255,255,.15); display: inline-block; padding: 3px 10px; border-radius: 999px;
    margin-bottom: 8px; width: fit-content;
  }
  .daily-banner-title a { color: #fff; font-size: 19px; font-weight: 700; text-decoration: none; line-height: 1.3; }
  .daily-banner-title a:hover { text-decoration: underline; }
  .daily-banner-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .daily-maker-toggles { display: flex; gap: 6px; flex-wrap: wrap; }
  .daily-remove-btn {
    margin-left: auto;
    border: 1px solid rgba(255,255,255,.25); background: none; color: #fff; opacity: .8;
    border-radius: 999px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  }

  .daily-picker { padding: 16px; }
  .daily-picker-label { color: #fff; font-size: 13px; font-weight: 600; margin-bottom: 10px; display: block; }
  .daily-search {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.1); color: #fff; font-size: 14px; margin-bottom: 8px;
  }
  .daily-search::placeholder { color: rgba(255,255,255,.6); }
  .daily-search-results {
    background: var(--card); border-radius: 8px; overflow: hidden; max-height: 260px; overflow-y: auto;
  }
  .daily-search-results:not(:empty) { margin-bottom: 10px; }
  .daily-search-result {
    display: flex; gap: 10px; align-items: center; padding: 8px 10px; cursor: pointer;
    border-bottom: 1px solid var(--border); color: var(--text); font-size: 13px;
  }
  .daily-search-result:last-child { border-bottom: none; }
  .daily-search-result:hover { background: var(--bg); }
  .daily-search-result img { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
  .daily-search-empty {
    padding: 8px 10px; font-size: 13px; color: var(--muted); background: var(--card); border-radius: 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  .daily-manual-trigger {
    border: none; background: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 0;
    text-decoration: underline; flex-shrink: 0;
  }
  .daily-manual-form { display: flex; flex-direction: column; gap: 6px; background: var(--card); border-radius: 8px; padding: 10px; }
  .daily-manual-form input {
    padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  .manual-confirm-btn {
    border: none; background: var(--accent); color: #fff; border-radius: 6px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; align-self: flex-start;
  }
  .daily-picker-makers { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .daily-picker-makers-label { color: rgba(255,255,255,.75); font-size: 12px; margin-right: 4px; }
  .avatar-toggle-btn {
    border: 2px solid transparent; background: none; padding: 0; border-radius: 999px; cursor: pointer; line-height: 0;
  }
  .avatar-toggle-btn.selected { border-color: #fff; }
  [data-tooltip] { position: relative; }
  [data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20,20,20,.95);
    color: #fff;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 12px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .08s ease;
    z-index: 100;
  }
  [data-tooltip]:hover::after { opacity: 1; }

  .empty, .loading { color: var(--muted); padding: 40px 0; text-align: center; }
  .config-warning {
    background: var(--accent-bg); color: var(--accent); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="logo.png" alt="De Tijd" class="logo">
      <h1>De 7 Topics</h1>
      <a href="archief.html" class="archive-link">Archief</a>
    </div>
    <div class="meta" id="meta">Laden...</div>
    <div class="who-picker" id="who-picker"></div>
    <div class="sort-toggle" id="sort-toggle">
      <button class="sort-btn" data-mode="best">Beste</button>
      <button class="sort-btn" data-mode="recent">Meest recent</button>
    </div>
  </header>
  <div id="config-warning" class="config-warning" style="display:none">
    Supabase is nog niet geconfigureerd — stemmen en comments worden niet bewaard.
  </div>
  <div id="daily-banner"></div>
  <div id="list"><div class="loading">Topics laden...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="common.js"></script>
<script>
function renderWhoPicker() {
  const el = document.getElementById("who-picker");
  const selected = currentUser();
  const isCustom = selected && !PEOPLE.some(p => p.name === selected);

  const presetHtml = PEOPLE.map(p => `
    <button class="who-btn ${selected === p.name ? "selected" : ""}" data-name="${escapeHtml(p.name)}">
      ${avatarHtml(p.name, 34)}
    </button>
  `).join("");

  el.innerHTML = `
    <span class="who-label">${selected ? "Jij bent " + escapeHtml(selected) + ":" : "Kies wie je bent, zodat je kan stemmen en reageren:"}</span>
    <div class="who-avatars">
      ${presetHtml}
      <button class="who-btn who-custom ${isCustom ? "selected" : ""}" data-name="__custom__">
        ${isCustom ? avatarHtml(selected, 34) : `<div class="avatar avatar-initials" data-tooltip="Andere naam" style="width:34px;height:34px">+</div>`}
      </button>
    </div>
  `;

  el.querySelectorAll(".who-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const isAlreadySelected =
        btn.dataset.name === selected || (btn.dataset.name === "__custom__" && isCustom);

      if (isAlreadySelected) {
        // Nogmaals klikken op de al-geselecteerde avatar deselecteert.
        clearCurrentUser();
        renderWhoPicker();
        render();
        return;
      }
      if (btn.dataset.name === "__custom__") {
        const name = prompt("Wat is je naam?", "");
        if (name && name.trim()) {
          setCurrentUser(name.trim());
          renderWhoPicker();
          render();
        }
      } else {
        setCurrentUser(btn.dataset.name);
        renderWhoPicker();
        render();
      }
    });
  });
}

function formatPubDate(raw) {
  if (!raw) return "";
  const d = new Date(raw);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleString("nl-BE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

function timeAgo(iso) {
  const d = new Date(iso);
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return "zonet";
  if (mins < 60) return `${mins} min geleden`;
  const hrs = Math.round(mins / 60);
  return `${hrs} u geleden`;
}

async function loadVotesAndComments() {
  if (!sb) return { starsByArticle: {}, votersByArticle: {}, myStarByArticle: {}, commentsByArticle: {} };

  const [{ data: votes, error: vErr }, { data: comments, error: cErr }] = await Promise.all([
    sb.from("votes").select("*").order("created_at", { ascending: true }),
    sb.from("comments").select("*").order("created_at", { ascending: true }),
  ]);
  if (vErr) console.error("votes error", vErr);
  if (cErr) console.error("comments error", cErr);

  // Per (article_id, voter) enkel de laatste stem meetellen (0 = ontsterd, 1 = ster).
  const latestVote = {};
  (votes || []).forEach(v => {
    latestVote[`${v.article_id}|${v.voter_id}`] = v.value;
  });

  const starsByArticle = {};
  const votersByArticle = {};
  const myStarByArticle = {};
  const me = currentUser();

  Object.entries(latestVote).forEach(([key, value]) => {
    const [articleId, voter] = key.split("|");
    if (value === 1) {
      starsByArticle[articleId] = (starsByArticle[articleId] || 0) + 1;
      (votersByArticle[articleId] = votersByArticle[articleId] || []).push(voter);
    }
    if (voter === me) myStarByArticle[articleId] = value === 1;
  });

  const commentsByArticle = {};
  (comments || []).forEach(c => {
    (commentsByArticle[c.article_id] = commentsByArticle[c.article_id] || []).push(c);
  });

  return { starsByArticle, votersByArticle, myStarByArticle, commentsByArticle };
}

async function toggleStar(articleId, isStarred) {
  const user = currentUser();
  if (!user) { alert("Kies eerst bovenaan wie je bent."); return; }
  if (!sb) { alert("Supabase is nog niet geconfigureerd."); return; }
  await sb.from("votes").insert({ article_id: articleId, voter_id: user, value: isStarred ? 0 : 1 });
  await render();
}

async function addComment(articleId, body) {
  const user = currentUser();
  if (!user) { alert("Kies eerst bovenaan wie je bent."); return; }
  if (!sb) { alert("Supabase is nog niet geconfigureerd."); return; }
  if (!body.trim()) return;
  await sb.from("comments").insert({ article_id: articleId, author: user, body: body.trim() });
  await render();
}

async function fetchDailyPick() {
  if (!sb) return null;
  const { data, error } = await sb.from("daily_picks").select("*").eq("pick_date", brusselsDateStr()).maybeSingle();
  if (error) { console.error("daily pick error", error); return null; }
  return data;
}

async function pinAsDaily(article, makers) {
  const user = currentUser();
  if (!user) { alert("Kies eerst bovenaan wie je bent."); return; }
  if (!sb) { alert("Supabase is nog niet geconfigureerd."); return; }

  const { error } = await sb.from("daily_picks").insert({
    pick_date: brusselsDateStr(),
    article_id: article.id,
    title: article.title,
    link: article.link,
    image: article.image,
    category: article.category,
    picked_by: user,
    makers: makers || [],
  });
  if (error) {
    console.error(error);
    alert(error.code === "23505"
      ? "Er is ondertussen al een daily gekozen. Herlaad de pagina."
      : "Kon de daily niet instellen.");
    return;
  }
  pendingMakers = new Set();
  await render();
}

let recentArticlesCache = null;
async function getRecentArticles() {
  if (recentArticlesCache) return recentArticlesCache;
  try {
    const res = await fetch("recent_articles.json", { cache: "no-store" });
    const data = await res.json();
    recentArticlesCache = data.articles || [];
  } catch (e) {
    console.error("Kon recent_articles.json niet laden:", e);
    recentArticlesCache = [];
  }
  return recentArticlesCache;
}

function extractArticleId(url) {
  const m = url.match(/(\d+)(?:\.html)?\/?(?:[?#].*)?$/);
  return m ? m[1] : `manual-${Date.now()}`;
}

function manualEntryHtml(prefillLink) {
  return `
    <div class="daily-manual-form">
      <input type="text" class="manual-title" placeholder="Titel van het artikel">
      <input type="text" class="manual-link" placeholder="Link (tijd.be-URL)" value="${escapeHtml(prefillLink || "")}">
      <button type="button" class="manual-confirm-btn">Bevestig als daily</button>
    </div>
  `;
}

function findArticleMatches(query, articles) {
  const q = query.trim();
  if (!q) return [];
  const idMatch = q.match(/(\d+)(?:\.html)?\/?(?:[?#].*)?$/);
  if (/^https?:\/\//i.test(q) && idMatch) {
    const found = articles.find(a => a.id === idMatch[1]);
    return found ? [found] : [];
  }
  const lower = q.toLowerCase();
  return articles.filter(a => a.title.toLowerCase().includes(lower)).slice(0, 6);
}

async function removeDailyPick(id) {
  if (!confirm("Daily-keuze van vandaag verwijderen?")) return;
  await sb.from("daily_picks").delete().eq("id", id);
  await render();
}

async function pinArticleFromCard(article) {
  const user = currentUser();
  if (!user) { alert("Kies eerst bovenaan wie je bent."); return; }
  if (!sb) { alert("Supabase is nog niet geconfigureerd."); return; }

  const existing = await fetchDailyPick();
  if (existing) {
    if (existing.article_id === article.id) return;
    const replace = confirm(
      `Er is al een daily gekozen vandaag:\n"${existing.title}"\n\nVervangen door:\n"${article.title}"?`
    );
    if (!replace) return;
    await sb.from("daily_picks").delete().eq("id", existing.id);
  }
  await pinAsDaily(article, []);
}

async function fetchIgnoredIds() {
  if (!sb) return new Set();
  const { data, error } = await sb.from("ignored_articles").select("article_id");
  if (error) { console.error("ignored_articles error", error); return new Set(); }
  return new Set((data || []).map(r => r.article_id));
}

async function ignoreArticle(article) {
  const user = currentUser();
  if (!user) { alert("Kies eerst bovenaan wie je bent."); return; }
  if (!sb) { alert("Supabase is nog niet geconfigureerd."); return; }
  const { error } = await sb.from("ignored_articles").insert({ article_id: article.id, ignored_by: user });
  if (error) { console.error(error); alert("Kon het artikel niet negeren."); return; }
  await render();
}

async function toggleMaker(pick, name) {
  const makers = pick.makers.includes(name)
    ? pick.makers.filter(m => m !== name)
    : [...pick.makers, name];
  await sb.from("daily_picks").update({ makers }).eq("id", pick.id);
  await render();
}

function makerToggleGridHtml(selectedNames) {
  return MAKER_PEOPLE.map(p => `
    <button class="avatar-toggle-btn ${selectedNames.includes(p.name) ? "selected" : ""}" data-name="${escapeHtml(p.name)}">
      ${avatarHtml(p.name, 26)}
    </button>
  `).join("");
}

function dailyBannerHtml(pick) {
  if (!pick) return "";
  const imageHtml = pick.image
    ? `<img class="daily-banner-image" src="${escapeHtml(pick.image)}" alt="" loading="lazy">`
    : "";
  return `
    <div class="daily-banner">
      ${imageHtml}
      <div class="daily-banner-overlay">
        <span class="daily-banner-tag">📌 Daily van vandaag</span>
        <div class="daily-banner-title"><a href="${escapeHtml(pick.link)}" target="_blank" rel="noopener">${escapeHtml(pick.title)}</a></div>
        <div class="daily-banner-row">
          <span class="daily-picker-makers-label">Wie werkt mee?</span>
          <div class="daily-maker-toggles">${makerToggleGridHtml(pick.makers)}</div>
          <button class="daily-remove-btn" data-id="${pick.id}">Verwijderen</button>
        </div>
      </div>
    </div>
  `;
}

let pendingMakers = new Set();

function dailyPickerHtml() {
  return `
    <div class="daily-banner">
      <div class="daily-picker">
        <span class="daily-picker-label">📌 De daily van vandaag is nog niet gekozen</span>
        <input type="text" class="daily-search" id="daily-search" placeholder="Zoek op titel of plak een tijd.be-link...">
        <div class="daily-search-results" id="daily-search-results"></div>
        <div class="daily-picker-makers">
          <span class="daily-picker-makers-label">Wie werkt mee? (optioneel)</span>
          ${makerToggleGridHtml(Array.from(pendingMakers))}
        </div>
      </div>
    </div>
  `;
}

function articleCard(article, stars, voters, myStar, comments) {
  const de7Badge = article.in_de7 ? `<span class="badge de7">🎙️ In De 7</span>` : "";
  const catBadge = article.category ? `<span class="badge">${escapeHtml(article.category)}</span>` : "";

  const shownVoters = (voters || []).slice(0, 8);
  const votersHtml = shownVoters.map(name => avatarHtml(name, 22)).join("");
  const votersExtra = (voters || []).length > 8
    ? `<span class="voters-extra">+${voters.length - 8}</span>`
    : "";

  const commentsHtml = (comments || []).map(c => `
    <div class="comment">
      ${avatarHtml(c.author, 24)}
      <div>
        <span class="author">${escapeHtml(c.author)}</span>
        <span class="muted">· ${timeAgo(c.created_at)}</span>
        <div class="body">${escapeHtml(c.body)}</div>
      </div>
    </div>
  `).join("");

  const imageHtml = article.image
    ? `<img class="card-image" src="${escapeHtml(article.image)}" alt="" loading="lazy">`
    : "";

  return `
  <div class="card" data-id="${article.id}">
    <div class="card-top">
      <div class="card-content">
        <div class="badges">${de7Badge}${catBadge}</div>
        <div class="title"><a href="${escapeHtml(article.link)}" target="_blank" rel="noopener">${escapeHtml(article.title)}</a></div>
        <div class="pubdate">${formatPubDate(article.pubDate)}</div>
      </div>
      ${imageHtml}
    </div>
    <div class="row">
      <div class="votes">
        <button class="star-btn ${myStar ? "starred" : ""}" data-id="${article.id}" data-tooltip="${myStar ? "Ontster" : "Stem op dit topic"}">${myStar ? "★" : "☆"}</button>
        <span class="net">${stars}</span>
        <div class="voters">${votersHtml}${votersExtra}</div>
        <span class="score">algoritme: ${article.score}</span>
      </div>
      <div class="card-actions">
        <button class="card-pin-btn" data-id="${article.id}" data-tooltip="Maak dit de daily">${PIN_ICON}</button>
        <button class="card-ignore-btn" data-id="${article.id}" data-tooltip="Negeer dit artikel">${EYE_OFF_ICON}</button>
      </div>
    </div>
    <div class="comments" id="comments-${article.id}">
      ${commentsHtml}
      <div class="comment-form">
        <input type="text" name="body" placeholder="Comment...">
        <button class="comment-submit" data-id="${article.id}">Post</button>
      </div>
    </div>
  </div>`;
}

let cachedData = null;
let sortMode = "best";
const sectionState = { active: true, suggested: true };

function section(key, title, items, variant, starsByArticle, votersByArticle, myStarByArticle, commentsByArticle) {
  if (items.length === 0) return "";
  const expanded = sectionState[key];
  const cards = items.map(a =>
    articleCard(a, starsByArticle[a.id] || 0, votersByArticle[a.id] || [], !!myStarByArticle[a.id], commentsByArticle[a.id])
  ).join("");
  return `
    <div class="section ${variant}">
      <button class="section-header" data-section="${key}">
        <span class="chevron">${expanded ? "▾" : "▸"}</span>
        <span class="section-title">${escapeHtml(title)}</span>
      </button>
      <div class="section-body" style="display:${expanded ? "block" : "none"}">${cards}</div>
    </div>
  `;
}

async function render() {
  const listEl = document.getElementById("list");
  const metaEl = document.getElementById("meta");

  if (!cachedData) {
    try {
      const res = await fetch("data.json", { cache: "no-store" });
      cachedData = await res.json();
    } catch (e) {
      listEl.innerHTML = `<div class="empty">Kon data.json niet laden. Is de GitHub Action al gedraaid?</div>`;
      return;
    }
  }

  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    document.getElementById("config-warning").style.display = "block";
  }

  const generated = new Date(cachedData.generated_at);
  metaEl.textContent = `Laatst ververst: ${generated.toLocaleString("nl-BE")} · ${cachedData.de7_matched_count} topic(s) gematcht met De 7`;

  let starsByArticle = {}, votersByArticle = {}, myStarByArticle = {}, commentsByArticle = {};
  try {
    ({ starsByArticle, votersByArticle, myStarByArticle, commentsByArticle } = await loadVotesAndComments());
  } catch (e) {
    console.error("Kon stemmen/comments niet laden (lijst wordt wel getoond):", e);
    document.getElementById("config-warning").style.display = "block";
  }

  const articleById = {};
  cachedData.articles.forEach(a => { articleById[a.id] = a; });

  let dailyPick = null;
  try {
    dailyPick = await fetchDailyPick();
  } catch (e) {
    console.error("Kon daily pick niet laden:", e);
  }
  let ignoredIds = new Set();
  try {
    ignoredIds = await fetchIgnoredIds();
  } catch (e) {
    console.error("Kon genegeerde artikels niet laden:", e);
  }
  const bannerEl = document.getElementById("daily-banner");
  if (dailyPick) {
    bannerEl.innerHTML = dailyBannerHtml(dailyPick);
    bannerEl.querySelectorAll(".daily-maker-toggles .avatar-toggle-btn").forEach(btn => {
      btn.addEventListener("click", () => toggleMaker(dailyPick, btn.dataset.name));
    });
    bannerEl.querySelector(".daily-remove-btn").addEventListener("click", () => removeDailyPick(dailyPick.id));
  } else {
    bannerEl.innerHTML = dailyPickerHtml();
    const searchInput = bannerEl.querySelector("#daily-search");
    const resultsEl = bannerEl.querySelector("#daily-search-results");

    const showManualForm = (prefillLink) => {
      resultsEl.innerHTML = manualEntryHtml(prefillLink);
      resultsEl.querySelector(".manual-confirm-btn").addEventListener("click", () => {
        const title = resultsEl.querySelector(".manual-title").value.trim();
        const link = resultsEl.querySelector(".manual-link").value.trim();
        if (!title || !link) { alert("Titel en link zijn verplicht."); return; }
        pinAsDaily({ id: extractArticleId(link), title, link, image: null, category: null }, Array.from(pendingMakers));
      });
    };

    searchInput.addEventListener("input", async () => {
      const query = searchInput.value;
      const pool = await getRecentArticles();
      if (searchInput.value !== query) return; // intussen verder getypt, negeer dit verouderde resultaat
      const trimmed = query.trim();
      const matches = findArticleMatches(query, pool);

      if (matches.length === 0) {
        if (!trimmed) { resultsEl.innerHTML = ""; return; }
        const looksLikeUrl = /^https?:\/\//i.test(trimmed);
        resultsEl.innerHTML = `
          <div class="daily-search-empty">
            <span>Geen match in de laatste 14 dagen.</span>
            <button type="button" class="daily-manual-trigger">Handmatig toevoegen</button>
          </div>
        `;
        resultsEl.querySelector(".daily-manual-trigger").addEventListener("click", () => showManualForm(looksLikeUrl ? trimmed : ""));
        return;
      }

      resultsEl.innerHTML = matches.map(a => `
        <div class="daily-search-result" data-id="${a.id}">
          ${a.image ? `<img src="${escapeHtml(a.image)}" alt="">` : ""}
          <span>${escapeHtml(a.title)}</span>
        </div>
      `).join("");
      resultsEl.querySelectorAll(".daily-search-result").forEach(el => {
        const match = matches.find(m => m.id === el.dataset.id);
        el.addEventListener("click", () => pinAsDaily(match, Array.from(pendingMakers)));
      });
    });

    bannerEl.querySelectorAll(".daily-picker-makers .avatar-toggle-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const name = btn.dataset.name;
        if (pendingMakers.has(name)) pendingMakers.delete(name); else pendingMakers.add(name);
        btn.classList.toggle("selected");
      });
    });
  }

  document.querySelectorAll(".sort-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.mode === sortMode);
  });

  const articles = [...cachedData.articles];
  if (sortMode === "recent") {
    articles.sort((a, b) => {
      const da = a.pubDate ? new Date(a.pubDate).getTime() : 0;
      const db = b.pubDate ? new Date(b.pubDate).getTime() : 0;
      return db - da;
    });
  } else {
    articles.sort((a, b) => {
      const ca = a.score + (starsByArticle[a.id] || 0) * 2;
      const cb = b.score + (starsByArticle[b.id] || 0) * 2;
      return cb - ca;
    });
  }

  if (articles.length === 0) {
    listEl.innerHTML = `<div class="empty">Geen recente artikels gevonden.</div>`;
    return;
  }

  const remaining = articles.filter(a =>
    a.id !== (dailyPick && dailyPick.article_id) && !ignoredIds.has(a.id)
  );
  const active = remaining.filter(a => (starsByArticle[a.id] || 0) > 0 || (commentsByArticle[a.id] || []).length > 0);
  const suggested = remaining.filter(a => !((starsByArticle[a.id] || 0) > 0 || (commentsByArticle[a.id] || []).length > 0));

  listEl.innerHTML =
    section("active", `Met stemmen & comments (${active.length})`, active, "highlight", starsByArticle, votersByArticle, myStarByArticle, commentsByArticle) +
    section("suggested", `Suggesties (${suggested.length})`, suggested, "", starsByArticle, votersByArticle, myStarByArticle, commentsByArticle);

  listEl.querySelectorAll(".section-header").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.section;
      sectionState[key] = !sectionState[key];
      const body = btn.nextElementSibling;
      body.style.display = sectionState[key] ? "block" : "none";
      btn.querySelector(".chevron").textContent = sectionState[key] ? "▾" : "▸";
    });
  });
  listEl.querySelectorAll(".star-btn").forEach(btn => {
    btn.addEventListener("click", () => toggleStar(btn.dataset.id, btn.classList.contains("starred")));
  });
  listEl.querySelectorAll(".card-pin-btn").forEach(btn => {
    btn.addEventListener("click", () => pinArticleFromCard(articleById[btn.dataset.id]));
  });
  listEl.querySelectorAll(".card-ignore-btn").forEach(btn => {
    btn.addEventListener("click", () => ignoreArticle(articleById[btn.dataset.id]));
  });
  listEl.querySelectorAll(".comment-submit").forEach(btn => {
    btn.addEventListener("click", () => {
      const form = btn.closest(".comments");
      const body = form.querySelector('input[name=body]').value;
      addComment(btn.dataset.id, body);
    });
  });
}

document.querySelectorAll(".sort-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    sortMode = btn.dataset.mode;
    render();
  });
});

renderWhoPicker();
render().catch(e => {
  console.error("Onverwachte fout bij renderen:", e);
  document.getElementById("list").innerHTML =
    `<div class="empty">Er ging iets mis bij het laden. Open de browserconsole (rechtermuisklik &gt; Inspecteren &gt; Console) voor details.</div>`;
});
</script>
</body>
</html>
